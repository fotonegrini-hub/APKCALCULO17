<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>DN Gráfica - Calculadora de Materiais</title>
    <!-- Tailwind CSS + Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        body {
            transition: background-color 0.3s ease, color 0.2s ease;
        }
        .tab-active {
            background-color: #3b82f6;
            color: white;
            border-bottom: 2px solid #1e40af;
        }
        .dark .tab-active {
            background-color: #2563eb;
            color: white;
        }
        .card-hover {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        input, button {
            transition: all 0.2s;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button {
            opacity: 0.5;
        }
        .overflow-x-auto {
            scrollbar-width: thin;
        }
        .editable-input:focus {
            transform: scale(1.02);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .datetime-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            padding: 8px 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .dark .datetime-container {
            background: linear-gradient(135deg, #4c51bf 0%, #5b3a7a 100%);
        }
        .clock-number {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .sync-badge {
            background: rgba(59,130,246,0.05);
            border-left: 3px solid #3b82f6;
        }
        .soma-destaque {
            transition: all 0.3s ease;
        }
        .soma-destaque:active {
            transform: scale(1.02);
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans antialiased">

    <div class="max-w-7xl mx-auto px-4 py-4 md:py-6 lg:py-8">
        <!-- Header com calendário e relógio -->
        <div class="flex flex-wrap items-center justify-between gap-3 mb-6 pb-2 border-b border-gray-200 dark:border-gray-700">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 w-10 h-10 rounded-xl flex items-center justify-center shadow-md">
                    <i class="fas fa-print text-white text-xl"></i>
                </div>
                <h1 class="text-2xl md:text-3xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">DN Gráfica</h1>
                <span class="text-xs bg-gray-200 dark:bg-gray-700 px-2 py-1 rounded-full">Calculadora Pro</span>
            </div>
            
            <div class="datetime-container flex items-center gap-3 px-4 py-2 rounded-xl">
                <div class="flex items-center gap-2">
                    <i class="fas fa-calendar-alt text-white text-sm"></i>
                    <span id="currentDate" class="text-white text-sm font-medium">00/00/0000</span>
                </div>
                <div class="w-px h-6 bg-white/30"></div>
                <div class="flex items-center gap-2">
                    <i class="fas fa-clock text-white text-sm"></i>
                    <span id="currentTime" class="text-white text-sm font-mono font-bold clock-number">00:00:00</span>
                </div>
            </div>
            
            <div class="flex gap-2">
                <button id="saveAllBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-xl shadow-md transition flex items-center gap-2">
                    <i class="fas fa-save"></i>
                    <span class="hidden sm:inline">Salvar Tudo</span>
                </button>
                <button id="themeToggle" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition">
                    <i class="fas fa-moon dark:hidden text-gray-700"></i>
                    <i class="fas fa-sun hidden dark:inline-block text-yellow-300"></i>
                </button>
            </div>
        </div>

        <!-- Área de abas -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl overflow-hidden mb-6">
            <div class="flex flex-wrap items-center border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50 px-2">
                <div id="tabsContainer" class="flex flex-1 overflow-x-auto py-2 gap-1 scroll-smooth"></div>
                <button id="addAbaBtn" class="ml-2 p-2 rounded-xl bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-300 hover:bg-blue-200 dark:hover:bg-blue-800 transition-all">
                    <i class="fas fa-plus-circle mr-1"></i> <span class="hidden sm:inline">Aba</span>
                </button>
            </div>
            <div id="abaContent" class="p-4 md:p-6 space-y-6"></div>
        </div>

        <!-- Painel Inferior com Somas Ativas -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-5 md:p-6 transition-all">
            <h2 class="text-xl font-bold flex items-center gap-2 mb-4"><i class="fas fa-calculator text-blue-500"></i> Soma inteligente</h2>
            
            <div id="sumCheckboxesPanel" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mb-6"></div>
            
            <div class="mb-6 p-4 rounded-xl bg-gradient-to-r from-purple-50 to-indigo-50 dark:from-purple-900/20 dark:to-indigo-900/20 border border-purple-200 dark:border-purple-800 soma-destaque">
                <div class="flex flex-wrap justify-between items-center">
                    <div class="flex items-center gap-2">
                        <i class="fas fa-chart-line text-purple-600 text-xl"></i>
                        <span class="font-semibold text-gray-700 dark:text-gray-300">📊 Soma Total (Abas Selecionadas)</span>
                    </div>
                    <div class="text-2xl font-bold text-purple-700 dark:text-purple-400">
                        R$ <span id="totalSelectedAbas">0.00</span>
                    </div>
                </div>
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-2"><i class="fas fa-check-square"></i> <span class="text-blue-600 dark:text-blue-400 font-semibold">Soma apenas das abas marcadas acima:</span> Selecione 1, 2 ou mais abas para ver o valor total dos materiais selecionados!</p>
            </div>
            
            <div class="border-t border-gray-200 dark:border-gray-700 pt-5 mt-2">
                <div class="flex flex-col md:flex-row gap-6 justify-between items-start md:items-end">
                    <div class="w-full md:w-1/2">
                        <label class="block text-sm font-medium mb-1 text-gray-600 dark:text-gray-400">💰 Preço de Venda (R$)</label>
                        <div class="flex items-center gap-2">
                            <span class="text-gray-500">R$</span>
                            <input type="number" id="precoVendaInput" step="0.01" placeholder="0,00" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                    <div class="w-full md:w-1/2 bg-gray-100 dark:bg-gray-700/50 p-4 rounded-xl">
                        <div class="flex justify-between items-center">
                            <span class="font-medium">📊 Margem de Lucro:</span>
                            <span id="lucroPercentual" class="text-2xl font-bold text-green-600 dark:text-green-400">0%</span>
                        </div>
                        <div class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                            Custo Total Selecionado: <span id="custoTotalSelecionadoSpan">R$ 0,00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ---------- ESTRUTURA DE DADOS ----------
        let appState = {
            abas: [],
            currentAbaId: null,
            selectedAbasIds: [],
            precoVenda: 0
        };

        let autoSaveTimer = null;
        let isSyncing = false;

        function gerarId() {
            return Date.now() + '-' + Math.random().toString(36).substr(2, 8);
        }

        function criarNovaAba(nomeSugerido = "Novo Edital") {
            return {
                id: gerarId(),
                nomeEdital: nomeSugerido,
                larguraRef: 60,
                comprimentoRef: 40,
                valorRef: 15,
                itens: [
                    {
                        id: gerarId(),
                        nome: "Exemplo Vinil",
                        largura: 20,
                        comprimento: 15
                    }
                ]
            };
        }

        function getInitialState() {
            const aba1 = {
                id: gerarId(),
                nomeEdital: "Vinil Adesivo",
                larguraRef: 60,
                comprimentoRef: 40,
                valorRef: 15,
                itens: [
                    { id: gerarId(), nome: "Adesivo Recorte", largura: 25, comprimento: 18 },
                    { id: gerarId(), nome: "Logo Porta", largura: 12, comprimento: 8 }
                ]
            };
            const aba2 = {
                id: gerarId(),
                nomeEdital: "Placa PVC",
                larguraRef: 100,
                comprimentoRef: 50,
                valorRef: 45,
                itens: [
                    { id: gerarId(), nome: "Adesivo Recorte", largura: 25, comprimento: 18 },
                    { id: gerarId(), nome: "Placa 40x30", largura: 40, comprimento: 30 }
                ]
            };
            return {
                abas: [aba1, aba2],
                currentAbaId: aba1.id,
                selectedAbasIds: [aba1.id, aba2.id],
                precoVenda: 0
            };
        }

        function loadState() {
            const saved = localStorage.getItem("dnGraficaState");
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.abas && Array.isArray(parsed.abas) && parsed.abas.length > 0) {
                        appState.abas = parsed.abas;
                        appState.currentAbaId = parsed.currentAbaId || appState.abas[0].id;
                        appState.selectedAbasIds = parsed.selectedAbasIds || appState.abas.map(a => a.id);
                        appState.precoVenda = parsed.precoVenda || 0;
                        appState.abas.forEach(aba => {
                            if (!aba.itens) aba.itens = [];
                            if (aba.larguraRef === undefined) aba.larguraRef = 60;
                            if (aba.comprimentoRef === undefined) aba.comprimentoRef = 40;
                            if (aba.valorRef === undefined) aba.valorRef = 15;
                            if (!aba.nomeEdital) aba.nomeEdital = "Edital sem nome";
                        });
                        return;
                    }
                } catch(e) { console.warn(e); }
            }
            const init = getInitialState();
            appState.abas = init.abas;
            appState.currentAbaId = init.currentAbaId;
            appState.selectedAbasIds = init.selectedAbasIds;
            appState.precoVenda = init.precoVenda;
        }

        function saveState(showToast = false) {
            const toSave = {
                abas: appState.abas,
                currentAbaId: appState.currentAbaId,
                selectedAbasIds: appState.selectedAbasIds,
                precoVenda: appState.precoVenda
            };
            localStorage.setItem("dnGraficaState", JSON.stringify(toSave));
            if (showToast) {
                showSaveToast();
            }
        }

        function showSaveToast() {
            const existingToast = document.querySelector('.toast');
            if (existingToast) existingToast.remove();
            
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = '<i class="fas fa-check-circle mr-2"></i> Dados salvos com sucesso!';
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        function autoSave() {
            if (autoSaveTimer) clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                saveState(false);
            }, 300);
        }

        function calcularValorItem(aba, larguraItem, comprimentoItem) {
            const areaRef = (aba.larguraRef || 0) * (aba.comprimentoRef || 0);
            if (areaRef === 0) return 0;
            const areaItem = larguraItem * comprimentoItem;
            return (areaItem / areaRef) * (aba.valorRef || 0);
        }

        function calcularSubtotalAba(aba) {
            if (!aba.itens || aba.itens.length === 0) return 0;
            let total = 0;
            for (let item of aba.itens) {
                const valor = calcularValorItem(aba, item.largura || 0, item.comprimento || 0);
                total += valor;
            }
            return total;
        }

        // Soma APENAS das abas selecionadas
        function calcularTotalAbasSelecionadas() {
            let total = 0;
            for (let aba of appState.abas) {
                if (appState.selectedAbasIds.includes(aba.id)) {
                    total += calcularSubtotalAba(aba);
                }
            }
            return total;
        }

        function calcularTotalSelecionado() {
            let total = 0;
            for (let aba of appState.abas) {
                if (appState.selectedAbasIds.includes(aba.id)) {
                    total += calcularSubtotalAba(aba);
                }
            }
            return total;
        }

        function atualizarTodasSomas() {
            const custoTotal = calcularTotalSelecionado();
            const preco = appState.precoVenda;
            let percentual = 0;
            if (custoTotal > 0 && preco > 0) {
                percentual = ((preco - custoTotal) / custoTotal) * 100;
            } else if (preco > 0 && custoTotal === 0) {
                percentual = 100;
            }
            
            const lucroElem = document.getElementById("lucroPercentual");
            if (lucroElem) lucroElem.innerText = percentual.toFixed(2) + "%";
            const custoSpan = document.getElementById("custoTotalSelecionadoSpan");
            if (custoSpan) custoSpan.innerHTML = `R$ ${custoTotal.toFixed(2)}`;
            
            // Atualizar o novo campo: Soma Total (Abas Selecionadas)
            const totalSelected = calcularTotalAbasSelecionadas();
            const totalSelectedSpan = document.getElementById("totalSelectedAbas");
            if (totalSelectedSpan) totalSelectedSpan.innerText = totalSelected.toFixed(2);
            
            if (lucroElem) {
                if (percentual >= 0) {
                    lucroElem.classList.add("text-green-600", "dark:text-green-400");
                    lucroElem.classList.remove("text-red-600");
                } else {
                    lucroElem.classList.add("text-red-600");
                    lucroElem.classList.remove("text-green-600", "dark:text-green-400");
                }
            }
        }

        // FUNÇÃO PRINCIPAL DE SINCRONIZAÇÃO
        function syncAllItemsAcrossAllAbas(sourceAbaId, changedItemNome, newLargura, newComprimento, newNome = null) {
            if (isSyncing) return;
            isSyncing = true;
            
            for (let aba of appState.abas) {
                if (aba.id === sourceAbaId) continue;
                
                const targetItems = aba.itens.filter(item => item.nome === changedItemNome);
                for (let targetItem of targetItems) {
                    let precisaAtualizar = false;
                    if (targetItem.largura !== newLargura) {
                        targetItem.largura = newLargura;
                        precisaAtualizar = true;
                    }
                    if (targetItem.comprimento !== newComprimento) {
                        targetItem.comprimento = newComprimento;
                        precisaAtualizar = true;
                    }
                    if (newNome !== null && targetItem.nome !== newNome) {
                        targetItem.nome = newNome;
                        precisaAtualizar = true;
                    }
                }
            }
            
            isSyncing = false;
            autoSave();
        }

        function syncRemoveItemAcrossAllAbas(sourceAbaId, itemNome) {
            if (isSyncing) return;
            isSyncing = true;
            
            for (let aba of appState.abas) {
                if (aba.id === sourceAbaId) continue;
                const indicesToRemove = [];
                for (let i = 0; i < aba.itens.length; i++) {
                    if (aba.itens[i].nome === itemNome) {
                        indicesToRemove.push(i);
                    }
                }
                for (let i = indicesToRemove.length - 1; i >= 0; i--) {
                    aba.itens.splice(indicesToRemove[i], 1);
                }
            }
            
            isSyncing = false;
            autoSave();
        }

        function syncAddItemAcrossAllAbas(sourceAbaId, newItem) {
            if (isSyncing) return;
            isSyncing = true;
            
            for (let aba of appState.abas) {
                if (aba.id === sourceAbaId) continue;
                const exists = aba.itens.some(item => item.nome === newItem.nome);
                if (!exists) {
                    aba.itens.push({
                        id: gerarId(),
                        nome: newItem.nome,
                        largura: newItem.largura,
                        comprimento: newItem.comprimento
                    });
                }
            }
            
            isSyncing = false;
            autoSave();
        }

        function updateAllVisibleValues() {
            atualizarTodasSomas();
            
            const currentAba = appState.abas.find(a => a.id === appState.currentAbaId);
            if (currentAba) {
                const itensContainer = document.getElementById("itensList");
                if (itensContainer) {
                    const itemDivs = itensContainer.querySelectorAll("[data-item-id]");
                    itemDivs.forEach(div => {
                        const itemId = div.getAttribute("data-item-id");
                        const item = currentAba.itens.find(i => i.id === itemId);
                        if (item) {
                            const largInput = div.querySelector("[data-field='largura']");
                            const compInput = div.querySelector("[data-field='comprimento']");
                            const valorDiv = div.querySelector('.font-bold.text-green-600');
                            
                            if (largInput && largInput.value != item.largura) largInput.value = item.largura;
                            if (compInput && compInput.value != item.comprimento) compInput.value = item.comprimento;
                            if (valorDiv) {
                                const novoValor = calcularValorItem(currentAba, item.largura, item.comprimento);
                                valorDiv.innerHTML = `R$ ${novoValor.toFixed(2)}`;
                            }
                        }
                    });
                }
            }
            
            renderSumPanel();
        }

        function renderTabs() {
            const container = document.getElementById("tabsContainer");
            if (!container) return;
            container.innerHTML = "";
            appState.abas.forEach((aba, idx) => {
                const isActive = appState.currentAbaId === aba.id;
                const tabBtn = document.createElement("button");
                tabBtn.className = `flex items-center gap-2 px-4 py-2 rounded-t-xl font-medium transition-all whitespace-nowrap ${isActive ? 'tab-active bg-blue-600 text-white shadow-md' : 'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700'}`;
                tabBtn.innerHTML = `
                    <i class="fas fa-layer-group text-sm"></i>
                    <span class="max-w-[120px] truncate">${escapeHtml(aba.nomeEdital || "Sem nome")}</span>
                    <i class="fas fa-times-circle text-xs ml-1 ${isActive ? 'text-white' : 'text-gray-400 hover:text-red-500'}" data-id="${aba.id}" data-remove></i>
                `;
                tabBtn.addEventListener("click", (e) => {
                    if (e.target.classList.contains('fa-times-circle') || e.target.closest('[data-remove]')) return;
                    appState.currentAbaId = aba.id;
                    renderAll();
                });
                const removeIcon = tabBtn.querySelector('[data-remove]');
                if (removeIcon) {
                    removeIcon.addEventListener("click", (e) => {
                        e.stopPropagation();
                        if (appState.abas.length === 1) {
                            alert("É necessário pelo menos uma aba. Adicione outra antes de remover.");
                            return;
                        }
                        const indexToRemove = appState.abas.findIndex(a => a.id === aba.id);
                        if (indexToRemove !== -1) {
                            appState.abas.splice(indexToRemove, 1);
                            if (appState.currentAbaId === aba.id) {
                                appState.currentAbaId = appState.abas[0].id;
                            }
                            appState.selectedAbasIds = appState.selectedAbasIds.filter(id => id !== aba.id);
                            renderAll();
                            autoSave();
                        }
                    });
                }
                container.appendChild(tabBtn);
            });
        }

        function renderAbaContent() {
            const container = document.getElementById("abaContent");
            if (!container) return;
            const currentAba = appState.abas.find(a => a.id === appState.currentAbaId);
            if (!currentAba) return;

            let html = `
                <div class="bg-gradient-to-br from-blue-50 to-indigo-50 dark:from-gray-700 dark:to-gray-800 rounded-xl p-5 shadow-sm border border-blue-100 dark:border-gray-600">
                    <div class="flex flex-wrap justify-between items-start gap-3 mb-4">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-ruler-combined text-blue-600 text-xl"></i>
                            <h3 class="font-bold text-lg">📐 Mídia Base de Referência</h3>
                        </div>
                        <div class="w-full sm:w-auto">
                            <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">🏷️ ABBA Edital / Nome do Projeto</label>
                            <input type="text" id="nomeEditalInput" value="${escapeHtml(currentAba.nomeEdital)}" class="w-full sm:w-64 px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 focus:ring-2 focus:ring-blue-500 editable-input">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">📏 Largura (cm)</label>
                            <input type="number" id="larguraRefInput" value="${currentAba.larguraRef}" step="0.1" class="mt-1 w-full p-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 editable-input">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">📐 Comprimento (cm)</label>
                            <input type="number" id="comprimentoRefInput" value="${currentAba.comprimentoRef}" step="0.1" class="mt-1 w-full p-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 editable-input">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">💰 Valor Referência (R$)</label>
                            <input type="number" id="valorRefInput" value="${currentAba.valorRef}" step="0.01" class="mt-1 w-full p-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 editable-input">
                        </div>
                    </div>
                    <div class="mt-3 text-xs text-blue-600 dark:text-blue-300 flex items-center gap-2 flex-wrap">
                        <i class="fas fa-sync-alt"></i>
                        <span><strong class="font-semibold">Sincronização TOTAL:</strong> Altere largura/altura em QUALQUER item → atualiza TODAS as abas!</span>
                    </div>
                </div>
                
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-lg flex items-center gap-2"><i class="fas fa-list-ul text-indigo-500"></i> Itens / Materiais</h3>
                        <button id="addItemBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-xl text-sm shadow-md transition flex items-center gap-1"><i class="fas fa-plus"></i> Adicionar item</button>
                    </div>
                    <div id="itensList" class="space-y-3"></div>
                </div>
            `;
            container.innerHTML = html;

            const nomeInput = document.getElementById("nomeEditalInput");
            const largRef = document.getElementById("larguraRefInput");
            const compRef = document.getElementById("comprimentoRefInput");
            const valorRef = document.getElementById("valorRefInput");
            
            const updateRef = () => {
                currentAba.nomeEdital = nomeInput.value;
                currentAba.larguraRef = parseFloat(largRef.value) || 0;
                currentAba.comprimentoRef = parseFloat(compRef.value) || 0;
                currentAba.valorRef = parseFloat(valorRef.value) || 0;
                updateAllVisibleValues();
                autoSave();
            };
            
            nomeInput.addEventListener("input", updateRef);
            largRef.addEventListener("input", updateRef);
            compRef.addEventListener("input", updateRef);
            valorRef.addEventListener("input", updateRef);
            
            renderItensList(currentAba);
            
            document.getElementById("addItemBtn").addEventListener("click", () => {
                const newItem = {
                    id: gerarId(),
                    nome: "Novo Material",
                    largura: 10,
                    comprimento: 10
                };
                currentAba.itens.push(newItem);
                syncAddItemAcrossAllAbas(currentAba.id, newItem);
                renderAbaContent();
                updateAllVisibleValues();
                autoSave();
            });
        }
        
        function renderItensList(aba) {
            const container = document.getElementById("itensList");
            if (!container) return;
            if (!aba.itens.length) {
                container.innerHTML = `<div class="text-center py-8 text-gray-400 bg-gray-50 dark:bg-gray-800/40 rounded-xl"><i class="fas fa-box-open"></i> Nenhum item. Adicione clicando acima.</div>`;
                return;
            }
            let itemsHtml = "";
            aba.itens.forEach((item, idx) => {
                const valorCalculado = calcularValorItem(aba, item.largura || 0, item.comprimento || 0);
                itemsHtml += `
                    <div class="bg-white dark:bg-gray-800/60 border border-gray-200 dark:border-gray-700 rounded-xl p-4 shadow-sm card-hover hover:shadow-md transition-all sync-badge" data-item-id="${item.id}" data-item-nome="${escapeHtml(item.nome)}">
                        <div class="flex flex-wrap gap-3 items-end">
                            <div class="flex-1 min-w-[140px]">
                                <label class="block text-xs font-medium text-gray-500 mb-1">📝 Nome do Material</label>
                                <input type="text" data-field="nome" value="${escapeHtml(item.nome)}" class="w-full p-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 focus:ring-2 focus:ring-blue-500 editable-input font-medium">
                            </div>
                            <div class="w-28">
                                <label class="block text-xs font-medium text-gray-500 mb-1">📏 Largura (cm)</label>
                                <input type="number" data-field="largura" value="${item.largura}" step="0.1" class="w-full p-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 focus:ring-2 focus:ring-blue-500 editable-input">
                            </div>
                            <div class="w-28">
                                <label class="block text-xs font-medium text-gray-500 mb-1">📐 Comprimento (cm)</label>
                                <input type="number" data-field="comprimento" value="${item.comprimento}" step="0.1" class="w-full p-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 focus:ring-2 focus:ring-blue-500 editable-input">
                            </div>
                            <div class="w-36">
                                <label class="block text-xs font-medium text-gray-500 mb-1">💰 Valor Calculado</label>
                                <div class="font-bold text-green-600 dark:text-green-400 bg-green-50 dark:bg-green-900/30 p-2.5 rounded-lg text-center border border-green-200 dark:border-green-800">R$ ${valorCalculado.toFixed(2)}</div>
                            </div>
                            <button data-remove-item="${item.id}" data-item-nome="${escapeHtml(item.nome)}" class="remove-item-btn mt-5 text-red-500 hover:text-red-700 hover:bg-red-50 dark:hover:bg-red-900/20 p-2 rounded-lg transition-all"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = itemsHtml;
            
            const itemDivs = container.querySelectorAll("[data-item-id]");
            itemDivs.forEach(div => {
                const itemId = div.getAttribute("data-item-id");
                const item = aba.itens.find(i => i.id === itemId);
                if (!item) return;
                const nomeInput = div.querySelector("[data-field='nome']");
                const largInput = div.querySelector("[data-field='largura']");
                const compInput = div.querySelector("[data-field='comprimento']");
                const removeBtn = div.querySelector(`.remove-item-btn`);
                const originalNome = item.nome;
                
                const updateItemAndSync = () => {
                    const oldNome = originalNome;
                    const newNome = nomeInput.value;
                    const newLargura = parseFloat(largInput.value) || 0;
                    const newComprimento = parseFloat(compInput.value) || 0;
                    
                    item.nome = newNome;
                    item.largura = newLargura;
                    item.comprimento = newComprimento;
                    
                    syncAllItemsAcrossAllAbas(aba.id, oldNome, newLargura, newComprimento, newNome);
                    updateAllVisibleValues();
                    
                    const valorDiv = div.querySelector('.font-bold.text-green-600');
                    if (valorDiv) {
                        const novoValor = calcularValorItem(aba, newLargura, newComprimento);
                        valorDiv.innerHTML = `R$ ${novoValor.toFixed(2)}`;
                    }
                };
                
                nomeInput.addEventListener("input", updateItemAndSync);
                largInput.addEventListener("input", updateItemAndSync);
                compInput.addEventListener("input", updateItemAndSync);
                
                if (removeBtn) {
                    removeBtn.addEventListener("click", () => {
                        const itemNome = item.nome;
                        const index = aba.itens.findIndex(i => i.id === itemId);
                        if (index !== -1) aba.itens.splice(index, 1);
                        syncRemoveItemAcrossAllAbas(aba.id, itemNome);
                        renderAbaContent();
                        updateAllVisibleValues();
                        autoSave();
                    });
                }
            });
        }
        
        function renderSumPanel() {
            const panel = document.getElementById("sumCheckboxesPanel");
            if (!panel) return;
            if (appState.abas.length === 0) {
                panel.innerHTML = `<div class="text-gray-400 col-span-full">Nenhuma aba para somar</div>`;
                return;
            }
            let html = "";
            for (let aba of appState.abas) {
                const subtotal = calcularSubtotalAba(aba);
                const isChecked = appState.selectedAbasIds.includes(aba.id);
                html += `
                    <label class="flex items-start gap-3 p-3 rounded-xl border ${isChecked ? 'border-blue-400 bg-blue-50 dark:bg-blue-900/20' : 'border-gray-200 dark:border-gray-700'} cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700/50 transition">
                        <input type="checkbox" value="${aba.id}" class="mt-1 w-5 h-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500" ${isChecked ? 'checked' : ''}>
                        <div class="flex-1">
                            <div class="font-semibold">📁 ${escapeHtml(aba.nomeEdital)}</div>
                            <div class="text-sm text-gray-500">Subtotal: R$ ${subtotal.toFixed(2)}</div>
                        </div>
                    </label>
                `;
            }
            panel.innerHTML = html;
            const checkboxes = panel.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(cb => {
                cb.addEventListener("change", (e) => {
                    const abaId = cb.value;
                    if (cb.checked) {
                        if (!appState.selectedAbasIds.includes(abaId)) appState.selectedAbasIds.push(abaId);
                    } else {
                        appState.selectedAbasIds = appState.selectedAbasIds.filter(id => id !== abaId);
                    }
                    autoSave();
                    atualizarTodasSomas();
                    renderSumPanel();
                });
            });
        }
        
        function bindPrecoVenda() {
            const input = document.getElementById("precoVendaInput");
            if (input) {
                input.value = appState.precoVenda.toFixed(2);
                input.addEventListener("input", (e) => {
                    appState.precoVenda = parseFloat(e.target.value) || 0;
                    autoSave();
                    atualizarTodasSomas();
                });
            }
        }
        
        function updateDateTime() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            const dateElement = document.getElementById("currentDate");
            const timeElement = document.getElementById("currentTime");
            if (dateElement) dateElement.innerText = `${day}/${month}/${year}`;
            if (timeElement) timeElement.innerText = `${hours}:${minutes}:${seconds}`;
        }
        
        function renderAll() {
            renderTabs();
            renderAbaContent();
            renderSumPanel();
            bindPrecoVenda();
            atualizarTodasSomas();
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function addNovaAba() {
            const nova = criarNovaAba(`Edital ${appState.abas.length + 1}`);
            appState.abas.push(nova);
            appState.currentAbaId = nova.id;
            if (!appState.selectedAbasIds.includes(nova.id)) appState.selectedAbasIds.push(nova.id);
            renderAll();
            autoSave();
        }
        
        function initTheme() {
            const isDark = localStorage.getItem("theme") === "dark" || (!localStorage.getItem("theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
            if (isDark) document.documentElement.classList.add("dark");
            else document.documentElement.classList.remove("dark");
            const toggle = document.getElementById("themeToggle");
            toggle.addEventListener("click", () => {
                document.documentElement.classList.toggle("dark");
                const nowDark = document.documentElement.classList.contains("dark");
                localStorage.setItem("theme", nowDark ? "dark" : "light");
            });
        }
        
        function init() {
            loadState();
            initTheme();
            renderAll();
            updateDateTime();
            setInterval(updateDateTime, 1000);
            document.getElementById("addAbaBtn").addEventListener("click", addNovaAba);
            document.getElementById("saveAllBtn").addEventListener("click", () => {
                saveState(true);
            });
        }
        
        init();
    </script>
</body>
</html>
